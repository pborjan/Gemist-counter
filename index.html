<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemišt Counter 🍷</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3b0764, #1e3a8a);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            background: rgba(255,255,255,0.08);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 35px;
        }

        #number {
            color: gold;
            font-size: 4rem;
        }

        .main-btn {
            background: gold;
            color: black;
            border: none;
            padding: 18px 35px;
            font-size: 1.4rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-btn:hover {
            transform: scale(1.05);
        }

        .reset-btn {
            margin-top: 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        p {
            margin-top: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>🍷 Gemišt Counter 🍷</h2>

    <h1>
        Popio si <span id="number">0</span> gemišta.
    </h1>

    <button class="main-btn" onclick="addGemist()">
        Još jedan! 🍷
    </button>

    <br>

    <button class="reset-btn" onclick="resetCounter()">
        Resetiraj brojač
    </button>

    <p>Sretan rođendan Otto! 🎉</p>

</div>

<script>
    // Automatski reset svake godine 7. lipnja

    const today = new Date();
    const currentYear = today.getFullYear();

    const lastReset = localStorage.getItem("lastReset");

    if (
        today.getMonth() === 5 &&
        today.getDate() === 7 &&
        lastReset != currentYear
    ) {
        localStorage.setItem("gemistCount", "0");
        localStorage.setItem("lastReset", currentYear);
    }

    let count = parseInt(localStorage.getItem("gemistCount")) || 0;

    updateDisplay();

    function addGemist() {
        count++;
        localStorage.setItem("gemistCount", count);
        updateDisplay();
    }

    function resetCounter() {
        if (confirm("Jesi siguran da želiš resetirati brojač?")) {
            count = 0;
            localStorage.setItem("gemistCount", count);
            updateDisplay();
        }
    }

    function updateDisplay() {
        document.getElementById("number").textContent = count;
    }
</script>

</body>
</html>
